# Blueprint Render.com: New + Blueprint → colar este repo
# https://render.com/docs/blueprint-spec
#
# Deploy rápido:
#   1. render.com → New → Blueprint → conectar repo
#   2. Setar no painel (Environment → Secret Files):
#      OPENAI_API_KEY = sk-...
#      API_KEY        = qualquer string secreta
#   3. (Opcional) adicionar disco persistente em /data e setar LEADS_FILE=/data/leads.jsonl

services:
  - type: web
    name: lead-intelligence-api
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: CORS_ORIGINS
        value: "*"
      # Setar como secrets no painel — nunca commitar valores reais:
      - key: OPENAI_API_KEY
        sync: false
      - key: API_KEY
        sync: false
