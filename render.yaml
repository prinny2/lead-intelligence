# Blueprint Render.com: New + Blueprint → colar este repo
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: lead-intelligence-api
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: CORS_ORIGINS
        value: "*"
      # Defina no painel (secret) ou após o deploy:
      # OPENAI_API_KEY
      # LEADS_FILE=/data/leads.jsonl  (se adicionar disco persistente)
