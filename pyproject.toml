[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lead-intelligence"
version = "0.2.0"
description = "Filtragem e qualificação de leads (accept/review/reject) + API FastAPI opcional"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Lead Intelligence contributors" }]
keywords = ["leads", "qualification", "filtering", "solar", "fastapi"]

# Pacote núcleo sem dependências externas
dependencies = []

[project.optional-dependencies]
api = [
    "fastapi>=0.100",
    "uvicorn[standard]>=0.22",
    "pydantic>=2.0",
    "openai>=1.0",
    "python-dotenv>=1.0",
]
dev = [
    "pytest>=7.0",
    "httpx>=0.24",
    "lead-intelligence[api]",
]

[project.urls]
Homepage = "https://github.com/prinny2/lead-intelligence"
Repository = "https://github.com/prinny2/lead-intelligence"

[tool.setuptools.packages.find]
where = ["."]
include = ["lead_intelligence*", "app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
