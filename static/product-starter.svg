<svg width="800" height="450" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <!-- Background -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fbbf24;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:0.05" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bgGrad)" rx="16"/>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="800" height="4" fill="url(#accentGrad)" rx="2"/>

  <!-- Badge background -->
  <rect x="40" y="40" width="160" height="36" rx="18" fill="url(#badgeGrad)" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.4"/>
  <text x="120" y="63" text-anchor="middle" fill="#f59e0b" font-size="13" font-weight="600" letter-spacing="1">STARTER</text>

  <!-- Sun icon -->
  <g transform="translate(600, 80)">
    <circle cx="0" cy="0" r="28" fill="#f59e0b" opacity="0.15"/>
    <circle cx="0" cy="0" r="16" fill="#f59e0b" opacity="0.9"/>
    <!-- rays -->
    <line x1="0" y1="-26" x2="0" y2="-32" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
    <line x1="0" y1="26" x2="0" y2="32" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
    <line x1="-26" y1="0" x2="-32" y2="0" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
    <line x1="26" y1="0" x2="32" y2="0" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
    <line x1="-18" y1="-18" x2="-22" y2="-22" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
    <line x1="18" y1="-18" x2="22" y2="-22" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
    <line x1="-18" y1="18" x2="-22" y2="22" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
    <line x1="18" y1="18" x2="22" y2="22" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- Plan name -->
  <text x="40" y="130" fill="#ffffff" font-size="42" font-weight="700">LeadSolar</text>
  <text x="40" y="175" fill="#f59e0b" font-size="42" font-weight="700">Starter</text>

  <!-- Tagline -->
  <text x="40" y="215" fill="#94a3b8" font-size="16">Qualifique até 500 leads/mês e pare de ligar</text>
  <text x="40" y="237" fill="#94a3b8" font-size="16">para quem nunca vai fechar.</text>

  <!-- Divider -->
  <line x1="40" y1="265" x2="760" y2="265" stroke="#334155" stroke-width="1"/>

  <!-- Features -->
  <g transform="translate(40, 290)">
    <!-- Feature 1 -->
    <circle cx="10" cy="10" r="10" fill="#f59e0b" opacity="0.2"/>
    <text x="10" y="15" text-anchor="middle" fill="#f59e0b" font-size="12">✓</text>
    <text x="30" y="15" fill="#e2e8f0" font-size="15">500 leads qualificados por mês</text>

    <!-- Feature 2 -->
    <circle cx="10" cy="46" r="10" fill="#f59e0b" opacity="0.2"/>
    <text x="10" y="51" text-anchor="middle" fill="#f59e0b" font-size="12">✓</text>
    <text x="30" y="51" fill="#e2e8f0" font-size="15">Score de prioridade diário</text>

    <!-- Feature 3 -->
    <circle cx="370" cy="10" r="10" fill="#f59e0b" opacity="0.2"/>
    <text x="370" y="15" text-anchor="middle" fill="#f59e0b" font-size="12">✓</text>
    <text x="390" y="15" fill="#e2e8f0" font-size="15">Mensagem WhatsApp pronta</text>

    <!-- Feature 4 -->
    <circle cx="370" cy="46" r="10" fill="#f59e0b" opacity="0.2"/>
    <text x="370" y="51" text-anchor="middle" fill="#f59e0b" font-size="12">✓</text>
    <text x="390" y="51" fill="#e2e8f0" font-size="15">Integração via webhook</text>
  </g>

  <!-- Bottom brand -->
  <text x="760" y="430" text-anchor="end" fill="#475569" font-size="13">leadsolarinteligencia.com.br</text>
</svg>
